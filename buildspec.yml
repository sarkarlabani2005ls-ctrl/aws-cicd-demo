version: 0.2

phases:
  build:
    commands:
      - test -f index.html
      - |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy CI/CD demo website" \
          --parameters 'commands=[
            "set -euxo pipefail",
            "dnf install -y nginx git",
            "rm -rf /tmp/aws-cicd-demo",
            "git clone --depth 1 https://github.com/sarkarlabani2005ls-ctrl/aws-cicd-demo.git /tmp/aws-cicd-demo",
            "install -m 0644 /tmp/aws-cicd-demo/index.html /usr/share/nginx/html/index.html",
            "systemctl enable nginx",
            "systemctl restart nginx"
          ]' \
          --query "Command.CommandId" \
          --output text)
        aws ssm wait command-executed \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID"
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID"
